StylesPath = tooling/prose/vale
# editors and the write-time hook show suggestions. vp staged and lint:prose pass --minAlertLevel=error
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Seedcord

[*.{yml,yaml}]
BasedOnStyles = Seedcord

[*.ts]
BasedOnStyles = Seedcord
# a comment may use one under writing-voice's two-cases shape
Seedcord.Semicolon = NO

# **/ because vp staged passes absolute paths
# the skills quote banned words as examples, and changelogs are generated
[**/{.agents,.claude}/**]
BasedOnStyles =

[**/{CHANGELOG.md,worker-configuration.d.ts,next-env.d.ts,seedcord-gen.ts,pnpm-lock.yaml}]
BasedOnStyles =

# next dev writes these three
[**/apps/{docs,guide,home}/AGENTS.md]
BasedOnStyles =

# posts and the AI policy are conversational voice
[**/apps/home/content/blog/**]
BasedOnStyles =

[**/AI_POLICY.md]
BasedOnStyles =
