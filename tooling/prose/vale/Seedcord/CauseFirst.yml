extends: existence
link: https://github.com/seedcord/seedcord/blob/next/.agents/skills/code-commenting-guidelines/SKILL.md
message: "', so' puts the cause first. Open with the thing on the line, then give the reason."
level: error
# TSDoc gets CauseFirstDocs, a suggestion
scope: comment.line
ignorecase: true
nonword: true
tokens:
  - ',\s+so\b(?![-\w])(?!\s+(?:far|on|long|much|many)\b)'
