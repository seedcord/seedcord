packages:
  - mock
  - packages/*
  - apps/*

embedReadme: true

overrides:
  # force the esbuild security patch (GHSA-gv7w-rqvm-qjhr) ahead of vite/vitest picking it up
  esbuild: ^0.28.1

allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

catalogs:
  deps:
    '@types/node': ^25.9.3
    chalk: ^5.6.2
    discord-api-types: ^0.38.48
    envapt: ^6.0.0
    eslint: ^9.39.4
    lucide-react: ^1.18.0
    motion: ^12.40.0
    prettier: ^3.8.4
    prettier-plugin-tailwindcss: ^0.8.0
    tailwindcss: ^4.3.0
    tsdown: ^0.22.2
    tsx: ^4.22.4
    type-fest: ^5.7.0
    vite: ^8.0.16
  peer:
    discord.js: ^14.26.4
    mongoose: ^9.7.0
    reflect-metadata: ^0.2.2
    typescript: ^6.0.3
  test:
    '@testing-library/jest-dom': ^6.9.1
    '@testing-library/react': ^16.3.2
    '@vitest/coverage-v8': ^4.1.8
    jsdom: ^29.1.1
    vitest: ^4.1.8
  react:
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    react: ^19.2.7
    react-dom: ^19.2.7

minimumReleaseAgeExclude:
  - envapt
