packages:
  - mock
  - packages/*
  - apps/*

allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

catalogs:
  deps:
    '@types/node': ^25.9.1
    chalk: ^5.6.2
    discord.js: ^14.26.4
    envapt: ^4.1.1
    mongoose: ^9.6.2
    prettier: ^3.8.3
    reflect-metadata: ^0.2.2
    type-fest: ^5.6.0
    vite: ^8.0.14
  docs:
    typedoc: ^0.28.19
    typedoc-plugin-dt-links: ^2.0.56
    typedoc-plugin-mdn-links: ^5.1.1
  peer:
    eslint: ^9.39.2
    tsdown: ^0.22.0
    tsx: ^4.22.3
    typescript: ^6.0.3
  react:
    '@types/react': ^19.2.15
    react: ^19.2.6

minimumReleaseAgeExclude:
  - oxlint-plugin-react-doctor@0.2.5
  - react-doctor@0.2.5
