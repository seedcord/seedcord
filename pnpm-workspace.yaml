packages:
  - mocks/*
  - packages/*
  - plugins/*
  - cli/*
  - tooling/*
  - apps/*
  - scripts

embedReadme: true

overrides:
  # forces one api-types copy so the djs-free reply types assign to djs
  discord-api-types: catalog:deps
  # an older miniflare still in the tree pins 7.29.1, and < 7.30.1 has GHSA-4w7w-5xrc-9h26
  'undici@7': ^7.30.2
  katex: ^0.19.1
  'zod@4': ^4.6.7
  vite@*: catalog:deps
  vitest@*: catalog:test

packageExtensions:
  ink-testing-library:
    peerDependencies:
      ink: '*'
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true

supportedArchitectures:
  libc:
    - current
    - glibc
    - musl

allowBuilds:
  '@tailwindcss/oxide': true
  '@vvago/vale': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalogs:
  deps:
    '@discordjs/rest': ^2.6.3
    '@leeoniya/ufuzzy': ^1.0.19
    '@mdx-js/mdx': ^3.1.1
    '@tailwindcss/postcss': ^4.3.5
    '@types/better-sqlite3': ^9.6.0
    '@types/hast': ^3.0.5
    '@types/mdast': ^4.0.4
    '@types/mdx': ^2.0.14
    '@types/node': ^26.6.6
    better-sqlite3: ^13.2.0
    cf: 1.0.0-rc.1
    chalk: ^6.0.1
    cli-spinners: ^3.4.0
    cross-env: ^10.1.0
    db0: 0.4.2
    discord-api-types: ^0.38.59
    fumadocs-core: 16.19.4
    fumadocs-mdx: 15.6.3
    handlebars: ^4.7.10
    ink: ^8.0.0
    jsonc-parser: ^3.3.1
    keyv: 6.1.0
    lucide-react: ^1.75.0
    mdast-util-to-hast: ^13.2.2
    mdast-util-to-markdown: ^2.2.3
    motion: ^14.14.0
    next: ^16.4.6
    prettier: ^3.10.1
    prettier-plugin-tailwindcss: ^0.8.1
    reflect-metadata: ^0.2.2
    takumi-js: 2.20.0
    tailwindcss: ^4.3.5
    type-fest: ^5.10.0
    unist-util-visit: ^5.2.0
    unstorage: 2.0.0-beta.0
    vfile: ^6.0.3
    yaml: ^2.9.1
    verkit: ^0.5.0
    es-toolkit: ^1.53.2
    vite: npm:@voidzero-dev/vite-plus-core@1.6.0
    vite-plus: 1.7.0
    zod: ^4.6.7
  eslint:
    '@eslint-react/eslint-plugin': ^5.30.4
    '@typescript-eslint/rule-tester': ^8.73.0
    '@typescript-eslint/utils': ^8.73.0
    '@types/eslint-plugin-security': ^3.0.1
    '@typescript-eslint/parser': ^8.73.0
    eslint: ^10.15.0
    eslint-config-next: ^16.4.6
    eslint-config-prettier: ^10.1.8
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-better-tailwindcss: ^4.11.0
    eslint-plugin-import-x: ^4.18.1
    eslint-plugin-mdx: ^3.10.1
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-security: ^4.2.1
    eslint-plugin-tailwind-canonical-classes: ^1.6.1
    eslint-plugin-tsdoc: ^0.5.4
    eslint-plugin-unicorn: ^76.0.0
    typescript-eslint: ^8.73.0
  peer:
    '@cloudflare/vite-plugin': 2.0.0-rc.1
    '@discordjs/builders': ^1.15.0
    discord.js: ^14.28.1
    envapt: ^9.2.0
    kysely: ^0.29.9
    mongoose: ^9.12.2
    typescript: ^6.0.3
    vite: ^8.3.8
    wrangler: ^4.164.0
  consumerTypes:
    typescript: ^5.9.3 || ^6.0.0 || ^7.0.0
  # typescript-eslint supports typescript below 6.1
  consumerLint:
    typescript: '>=5.9.3 <6.1.0'
  test:
    dedent: ^1.7.2
    '@testing-library/dom': ^10.4.2
    '@testing-library/jest-dom': ^7.0.1
    '@testing-library/react': ^16.3.3
    '@testing-library/user-event': ^14.6.12
    '@vitest/coverage-v8': 5.1.1
    jsdom: ^30.1.3
    vitest: 5.1.1
  react:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1

peerDependencyRules:
  allowAny:
    - vite
    - vitest

patchedDependencies:
  '@vvago/vale@3.25.1': patches/@vvago__vale@3.25.1.patch
