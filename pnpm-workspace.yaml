packages:
  - mock
  - packages/*
  - apps/*

embedReadme: true

overrides:
  # discord.js/rest pin undici 6.24.1; < 6.27 has a WebSocket DoS (GHSA-vxpw-j846-p89q)
  discord.js>undici: ^6.27.0
  '@discordjs/rest>undici': ^6.27.0
  # forces one api-types copy so the djs-free reply types assign to djs
  discord-api-types: ^0.38.49

allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalogs:
  deps:
    '@tailwindcss/postcss': ^4.3.1
    '@types/node': ^25.9.3
    chalk: ^5.6.2
    discord-api-types: ^0.38.49
    envapt: ^6.0.2
    eslint: ^10.6.0
    eslint-config-next: ^16.2.9
    eslint-plugin-jsx-a11y: ^6.10.2
    eslint-plugin-react-compiler: 19.1.0-rc.2
    lucide-react: ^1.21.0
    motion: ^12.40.0
    next: ^16.2.9
    prettier: ^3.8.4
    prettier-plugin-tailwindcss: ^0.8.0
    shiki: ^4.2.0
    tailwindcss: ^4.3.1
    tsdown: ^0.22.3
    tsx: ^4.22.4
    type-fest: ^5.7.0
    vite: ^8.0.16
  peer:
    discord.js: ^14.26.4
    mongoose: ^9.7.1
    reflect-metadata: ^0.2.2
    typescript: ^6.0.3
  test:
    '@testing-library/jest-dom': ^6.9.1
    '@testing-library/react': ^16.3.2
    '@vitest/coverage-v8': ^4.1.9
    jsdom: ^29.1.1
    vitest: ^4.1.9
  react:
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    react: ^19.2.7
    react-dom: ^19.2.7

minimumReleaseAgeExclude:
  - envapt
  - eslint-plugin-unicorn@70.0.0
