packages:
  - mocks/*
  - packages/*
  - plugins/*
  - cli/*
  - tooling/*
  - apps/*

embedReadme: true

overrides:
  # discord.js/rest pin undici 6.24.1
  discord.js>undici: ^6.27.0
  '@discordjs/rest>undici': ^6.27.0
  # < 7.29 has GHSA-4cwx-7wf7-3272
  'undici@7': ^7.29.0
  # forces one api-types copy so the djs-free reply types assign to djs
  discord-api-types: ^0.38.52
  # djs pins 3.5.3, rest needs ^3.5.5, collapse to one (same API)
  '@sapphire/snowflake': 3.5.5

  brace-expansion: ^5.0.9 # < 5.0.9 has GHSA-rgw5-rvv9-x895
  minimatch: ^10.2.6 # brace-expansion 5 exports named `expand` while minimatch 9 default-imports it
  'fast-uri@3': ^3.1.5 # < 3.1.5 has GHSA-7p8r-x3mc-p8w7
  'nanoid@3': ^3.3.17 # < 3.3.17 has GHSA-2v37-7h3g-55p8
  'js-yaml@3': ^3.15.1
  'js-yaml@4': ^4.3.1
  'linkify-it@5': ^5.0.2
  postcss: ^8.5.25
  sharp: ^0.35.3

supportedArchitectures:
  libc:
    - current
    - glibc
    - musl

allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalogs:
  deps:
    '@clack/prompts': ^1.7.0
    '@discordjs/builders': ^1.14.1
    '@discordjs/rest': ^2.6.3
    '@tailwindcss/postcss': ^4.3.3
    '@types/node': ^26.1.2
    chalk: ^6.0.0
    discord-api-types: ^0.38.52
    lodash.merge: ^4.6.2
    lucide-react: ^1.28.0
    motion: ^12.43.0
    next: ^16.2.12
    prettier: ^3.9.6
    prettier-plugin-tailwindcss: ^0.8.1
    reflect-metadata: ^0.2.2
    shiki: ^4.4.3
    tailwindcss: ^4.3.3
    tsdown: ^0.22.14
    tsx: ^4.23.5
    type-fest: ^5.8.0
    vite: ^8.2.0
    wrangler: ^4.118.0
  eslint:
    '@typescript-eslint/rule-tester': ^8.65.0
    '@typescript-eslint/utils': ^8.65.0
    '@types/eslint-plugin-security': ^3.0.1
    '@typescript-eslint/parser': ^8.65.0
    eslint: ^10.8.0
    eslint-config-next: ^16.2.12
    eslint-config-prettier: ^10.1.8
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-better-tailwindcss: ^4.7.0
    eslint-plugin-import-x: ^4.17.1
    eslint-plugin-mdx: ^3.8.1
    eslint-plugin-prettier: ^5.5.6
    eslint-plugin-react-compiler: 19.1.0-rc.2
    eslint-plugin-security: ^4.0.1
    eslint-plugin-tailwind-canonical-classes: ^1.4.1
    eslint-plugin-tsdoc: ^0.5.2
    eslint-plugin-unicorn: ^72.0.0
    typescript-eslint: ^8.65.0
  peer:
    discord.js: ^14.27.0
    envapt: ^8.1.1
    mongoose: ^9.9.1
    typescript: ^6.0.3
  test:
    dedent: ^1.7.2
    '@testing-library/dom': ^10.4.1
    '@testing-library/jest-dom': ^7.0.0
    '@testing-library/react': ^16.3.2
    '@testing-library/user-event': ^14.6.1
    '@vitest/coverage-v8': ^4.1.10
    jsdom: ^30.0.1
    vitest: ^4.1.10
  react:
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.4
    react: ^19.2.8
    react-dom: ^19.2.8
