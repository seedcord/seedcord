packages:
- mock
- packages/*
- apps/*

embedReadme: true

overrides:
  # discord.js/rest pin undici 6.24.1; < 6.27 has a WebSocket DoS (GHSA-vxpw-j846-p89q)
  discord.js>undici: ^6.27.0
  '@discordjs/rest>undici': ^6.27.0
  # forces one api-types copy so the djs-free reply types assign to djs
  discord-api-types: ^0.38.51
  # djs pins 3.5.3, rest needs ^3.5.5, collapse to one (same API)
  '@sapphire/snowflake': 3.5.5

  brace-expansion: ^5.0.8
  minimatch: ^10.2.5 # brace-expansion 5 exports `expand` named, minimatch 9 default-imports it
  'fast-uri@3': ^3.1.4
  'js-yaml@3': ^3.15.0
  'js-yaml@4': ^4.3.0
  'linkify-it@5': ^5.0.2
  postcss: ^8.5.18
  sharp: ^0.35.0

allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalogs:
  deps:
    '@discordjs/builders': ^1.14.1
    '@discordjs/rest': ^2.6.2
    '@tailwindcss/postcss': ^4.3.1
    '@types/node': ^25.9.3
    chalk: ^5.6.2
    discord-api-types: ^0.38.51
    envapt: ^8.1.0
    lodash.merge: ^4.6.2
    lucide-react: ^1.21.0
    motion: ^12.40.0
    next: ^16.2.11
    prettier: ^3.8.4
    prettier-plugin-tailwindcss: ^0.8.0
    shiki: ^4.2.0
    tailwindcss: ^4.3.1
    tsdown: ^0.22.3
    tsx: ^4.22.4
    type-fest: ^5.7.0
    vite: ^8.0.16
  eslint:
    '@typescript-eslint/rule-tester': ^8.61.1
    '@typescript-eslint/utils': ^8.61.1
    '@types/eslint-plugin-security': ^3.0.1
    '@typescript-eslint/parser': ^8.61.1
    eslint: ^10.7.0
    eslint-config-next: ^16.2.11
    eslint-config-prettier: ^10.1.8
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-better-tailwindcss: ^4.6.0
    eslint-plugin-import-x: ^4.17.1
    eslint-plugin-mdx: ^3.8.1
    eslint-plugin-prettier: ^5.5.6
    eslint-plugin-react-compiler: 19.1.0-rc.2
    eslint-plugin-security: ^4.0.1
    eslint-plugin-tailwind-canonical-classes: ^1.3.3
    eslint-plugin-tsdoc: ^0.5.2
    eslint-plugin-unicorn: ^70.0.0
    typescript-eslint: ^8.61.1
  peer:
    discord.js: ^14.27.0
    mongoose: ^9.7.1
    reflect-metadata: ^0.2.2
    typescript: ^6.0.3
  test:
    dedent: ^1.7.2
    '@testing-library/jest-dom': ^6.9.1
    '@testing-library/react': ^16.3.2
    '@vitest/coverage-v8': ^4.1.10
    jsdom: ^29.1.1
    vitest: ^4.1.10
  react:
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    react: ^19.2.7
    react-dom: ^19.2.7

minimumReleaseAgeExclude:
- discord-api-types@0.38.51
