packages:
  - mocks/*
  - packages/*
  - plugins/*
  - cli/*
  - tooling/*
  - apps/*
  - scripts

embedReadme: true

overrides:
  # forces one api-types copy so the djs-free reply types assign to djs
  discord-api-types: ^0.38.52
  # miniflare pins both below the fix
  sharp: ^0.35.5 # < 0.35.5 has GHSA-wq5f-xc86-pv6w through librsvg
  'undici@7': ^7.29.1 # < 7.29.1 has GHSA-4cwx-7wf7-3272
  katex: ^0.18.2
  'zod@4': ^4.6.7

packageExtensions:
  ink-testing-library:
    peerDependencies:
      ink: '*'
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true

supportedArchitectures:
  libc:
    - current
    - glibc
    - musl

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalogs:
  deps:
    '@discordjs/builders': ^1.14.1
    '@discordjs/rest': ^2.6.3
    '@leeoniya/ufuzzy': ^1.0.19
    '@mdx-js/mdx': ^3.1.1
    '@tailwindcss/postcss': ^4.3.3
    '@types/hast': ^3.0.5
    '@types/mdast': ^4.0.4
    '@types/mdx': ^2.0.14
    '@types/node': ^26.1.2
    '@types/pg': ^8.23.1
    cf: 1.0.0-beta.17
    chalk: ^6.0.0
    cli-spinners: ^3.4.0
    cross-env: ^10.1.0
    discord-api-types: ^0.38.52
    fumadocs-core: 16.15.18
    fumadocs-mdx: 15.4.6
    handlebars: ^4.7.10
    ink: ^8.0.0
    lucide-react: ^1.51.0
    mdast-util-to-hast: ^13.2.1
    mdast-util-to-markdown: ^2.1.3
    motion: ^14.0.0
    next: ^16.4.2
    prettier: ^3.9.6
    prettier-plugin-tailwindcss: ^0.8.1
    reflect-metadata: ^0.2.2
    takumi-js: 2.14.0
    tailwindcss: ^4.3.3
    tsdown: ^0.23.0
    tsx: ^4.23.15
    type-fest: ^5.9.0
    unist-util-visit: ^5.1.0
    vfile: ^6.0.3
    yaml: ^2.9.1
    verkit: ^0.5.0
    es-toolkit: ^1.53.0
  eslint:
    '@eslint-react/eslint-plugin': ^5.18.1
    '@typescript-eslint/rule-tester': ^8.65.0
    '@typescript-eslint/utils': ^8.65.0
    '@types/eslint-plugin-security': ^3.0.1
    '@typescript-eslint/parser': ^8.65.0
    eslint: ^10.8.0
    eslint-config-next: ^16.4.2
    eslint-config-prettier: ^10.1.8
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-better-tailwindcss: ^4.7.0
    eslint-plugin-import-x: ^4.17.1
    eslint-plugin-mdx: ^3.8.1
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-security: ^4.0.1
    eslint-plugin-tailwind-canonical-classes: ^1.4.1
    eslint-plugin-tsdoc: ^0.5.4
    eslint-plugin-unicorn: ^76.0.0
    typescript-eslint: ^8.65.0
  peer:
    '@cloudflare/vite-plugin': 2.0.0-beta.v.0
    discord.js: ^14.27.0
    envapt: ^9.2.0
    kysely: ^0.29.4
    mongoose: ^9.9.1
    pg: ^8.22.0
    typescript: ^6.0.3
    vite: ^8.3.4
    wrangler: ^4.150.0
  consumerTypes:
    typescript: ^5.9.3 || ^6.0.0 || ^7.0.0
  # typescript-eslint supports typescript below 6.1
  consumerLint:
    typescript: '>=5.9.3 <6.1.0'
  test:
    dedent: ^1.7.2
    '@testing-library/dom': ^10.4.2
    '@testing-library/jest-dom': ^7.0.1
    '@testing-library/react': ^16.3.3
    '@testing-library/user-event': ^14.6.7
    '@vitest/coverage-v8': ^4.1.12
    jsdom: ^30.1.1
    vitest: ^4.1.12
  react:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1

minimumReleaseAgeExclude:
  - es-toolkit@1.53.0
  - envapt@9.2.0
