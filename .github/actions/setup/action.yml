name: 'Setup workspace'
description: 'Install pnpm, set up Node, optionally restore deps via pnpm install --frozen-lockfile.'

inputs:
    node-version:
        description: 'Node.js version'
        required: false
        default: '26'
    registry-url:
        description: 'Optional npm registry URL (set for publish jobs)'
        required: false
        default: ''
    install:
        description: 'Run `pnpm install --frozen-lockfile` as the final step'
        required: false
        default: 'true'

runs:
    using: composite
    steps:
        - name: Set up pnpm
          uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

        - name: Set up Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
              node-version: ${{ inputs.node-version }}
              cache: pnpm
              registry-url: ${{ inputs.registry-url }}

        - name: Install dependencies
          if: ${{ inputs.install == 'true' }}
          shell: bash
          run: pnpm install --frozen-lockfile
