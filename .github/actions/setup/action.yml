name: 'Setup workspace'
description: 'Install Vite+ and Node, then optionally run vp install --frozen-lockfile.'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
  # publish switches this off so nothing from a poisoned cache ends up on npm
  cache:
    description: 'Enable caching of project dependencies'
    required: false
    default: 'true'
  registry-url:
    description: 'Optional npm registry URL (set for publish jobs)'
    required: false
    default: ''
  install:
    description: 'Run `vp install --frozen-lockfile` as the final step'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: package.json
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}
        run-install: ${{ inputs.install }}
