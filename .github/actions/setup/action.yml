name: 'Setup workspace'
description: 'Install Vite+ and Node, then optionally run vp install --frozen-lockfile.'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
  # publish switches this off so nothing from a poisoned cache ends up on npm
  cache:
    description: 'Enable caching of project dependencies'
    required: false
    default: 'true'
  registry-url:
    description: 'Optional npm registry URL (set for publish jobs)'
    required: false
    default: ''
  install:
    description: 'Run `vp install --frozen-lockfile` as the final step'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: package.json
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}
        run-install: ${{ inputs.install }}
