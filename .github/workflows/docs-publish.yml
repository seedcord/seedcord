name: docs-publish

on:
    workflow_call:
        inputs:
            published:
                required: true
                type: string
    workflow_dispatch:
        inputs:
            published:
                description: 'JSON array of { "name", "version" } objects to sync'
                required: true
                type: string

permissions:
    contents: read

env:
    SEEDCORD_DOCS_INDEX_URL: https://cdn.seedcord.org/index.json

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  fetch-depth: 0
            - name: Turbo cache
              uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'
            - name: Setup workspace
              uses: ./.github/actions/setup

            - name: Build
              run: pnpm build

            - name: Sync published docs to R2
              run: pnpm docs:sync --extract --published "$PUBLISHED"
              env:
                  PUBLISHED: ${{ inputs.published }}
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  R2_BUCKET: ${{ vars.R2_BUCKET }}

            - name: Purge CDN cache
              run: pnpm docs:purge --prefixes docs.seedcord.org
              env:
                  CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
                  CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}

            - name: Redeploy prod docs
              run: |
                  npm i -g @railway/cli
                  railway redeploy --service "${{ vars.RAILWAY_DOCS_SERVICE }}" --environment production --yes
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
