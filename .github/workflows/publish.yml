name: publish

on:
    workflow_run:
        workflows: ['checks']
        types: [completed]
        branches: [main, next]
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    # head_branch (not ref_name) tells main from next: workflow_run sets ref_name to the default branch.
    group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
    cancel-in-progress: false

env:
    SEEDCORD_DOCS_INDEX_URL: https://cdn.seedcord.org/index.json

jobs:
    eligibility:
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && github.repository == 'seedcord/seedcord' }}
        runs-on: ubuntu-latest
        outputs:
            publish: ${{ steps.gate.outputs.publish }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - id: gate
              uses: ./.github/actions/check-eligibility
              with:
                  branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}

    dry-run-npm:
        needs: eligibility
        if: ${{ needs.eligibility.outputs.publish == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  fetch-depth: 0
            - name: Setup workspace
              uses: ./.github/actions/setup
            - run: pnpm publish --dry-run --workspace-root --no-git-checks

    npm-publish:
        needs: [eligibility, dry-run-npm]
        if: ${{ needs.eligibility.outputs.publish == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            published: ${{ steps.changesets.outputs.published }}
            publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
        permissions:
            contents: write
            id-token: write
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  fetch-depth: 0
            - name: Turbo cache
              uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'
            - name: Setup workspace
              uses: ./.github/actions/setup
              with:
                  registry-url: https://registry.npmjs.org
            # changesets 2.31.0 misreads npm 12 json output, unpin when changesets supports npm 12
            - run: npm i -g npm@11
            - run: node -v && npm -v
            - run: npm config get registry && npm ping

            - name: Build prettier config dependency
              run: pnpm exec turbo run build --filter=@seedcord/eslint-config

            - id: changesets
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  version: pnpm run release:version
                  publish: pnpm run release
                  commit: 'chore(release): version packages'
                  title: 'chore: release packages'
                  branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'
                  HUSKY: 0

    docs-publish:
        needs: npm-publish
        if: ${{ needs.npm-publish.outputs.published == 'true' }}
        uses: ./.github/workflows/docs-publish.yml
        with:
            published: ${{ needs.npm-publish.outputs.publishedPackages }}
        secrets: inherit
