name: publish

on:
    workflow_run:
        workflows: ['checks']
        types: [completed]
        branches: [main, next]
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    # head_branch (not ref_name) tells main from next: workflow_run sets ref_name to the default branch.
    group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
    cancel-in-progress: false

env:
    SEEDCORD_DOCS_INDEX_URL: https://cdn.seedcord.org/index.json

jobs:
    eligibility:
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && github.repository == 'seedcord/seedcord' }}
        runs-on: ubuntu-latest
        outputs:
            publish: ${{ steps.gate.outputs.publish }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - id: gate
              uses: ./.github/actions/check-eligibility
              with:
                  branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}

    dry-run-npm:
        needs: eligibility
        if: ${{ needs.eligibility.outputs.publish == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  fetch-depth: 0
            - name: Setup workspace
              uses: ./.github/actions/setup
            - run: pnpm publish --dry-run --workspace-root --no-git-checks

    npm-publish:
        needs: [eligibility, dry-run-npm]
        if: ${{ needs.eligibility.outputs.publish == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            published: ${{ steps.changesets.outputs.published }}
            publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
        permissions:
            contents: write
            id-token: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  fetch-depth: 0
            - name: Turbo cache
              uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'
            - name: Setup workspace
              uses: ./.github/actions/setup
              with:
                  registry-url: https://registry.npmjs.org
            - run: npm i -g npm@latest
            - run: node -v && npm -v
            - run: npm config get registry && npm ping

            - name: Build prettier config dependency
              run: pnpm --filter @seedcord/eslint-config build

            - id: changesets
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  publish: pnpm run release
                  commit: 'chore(release): version packages'
                  title: 'chore: release packages'
                  branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'
                  HUSKY: 0

    docs-publish:
        needs: npm-publish
        if: ${{ needs.npm-publish.outputs.published == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  fetch-depth: 0
            - name: Turbo cache
              uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'
            - name: Setup workspace
              uses: ./.github/actions/setup

            - name: Build
              run: pnpm build

            - name: Sync published docs to R2
              run: pnpm docs:sync --extract --published '${{ needs.npm-publish.outputs.publishedPackages }}'
              env:
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  R2_BUCKET: ${{ vars.R2_BUCKET }}

            - name: Purge CDN cache
              run: pnpm docs:purge --prefixes docs.seedcord.org
              env:
                  CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
                  CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}

            - name: Redeploy prod docs
              run: |
                  npm i -g @railway/cli
                  railway redeploy --service "${{ vars.RAILWAY_DOCS_SERVICE }}" --environment production --yes
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
