name: checks

on:
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - 'assets/**'
    push:
        branches:
            - main
            - next
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - 'assets/**'
    merge_group:
        types: [checks_requested]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'
            - uses: ./.github/actions/setup
            - run: pnpm check:catalog
            - run: pnpm lint

    format:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        name: Format
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'
            - uses: ./.github/actions/setup
            - run: pnpm fmt:check

    typecheck:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        name: Type check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'
            - uses: ./.github/actions/setup
            - run: pnpm tc

    test:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'
            - uses: ./.github/actions/setup
            # raising this concurrency starves the eslint and prettier fixture suites into timeouts
            - run: pnpm turbo test --concurrency=2

    build:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'
            - uses: ./.github/actions/setup
            - run: pnpm build
              env:
                  SEEDCORD_DOCS_INDEX_URL: https://cdn.seedcord.org/index.json
            - run: pnpm turbo docs:extract

    audit:
        if: github.event_name == 'push'
        name: Audit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - run: pnpm audit --prod --audit-level=high
