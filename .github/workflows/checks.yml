name: checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!assets/**'
      - '.changeset/**'
  push:
    branches:
      - main
      - next
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!assets/**'
      - '.changeset/**'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-cache
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup
      - run: vp run check:catalog
      - run: vp run lint:changesets
      - run: vp run lint

  format:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-cache
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup
      - run: vp run fmt:check

  typecheck:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-cache
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup
      - run: vp run tc
      - run: vp run tc:root

  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-cache
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup
      # raising this concurrency starves the eslint and prettier fixture suites into timeouts
      - run: vp exec turbo test --concurrency=2

  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-cache
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup
      - run: vp run build:all
      - run: vp run codegen:check

  typescript-floor:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: TypeScript floor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-cache
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup
      - run: vp exec turbo build --filter='@seedcord/mock-gateway^...' --filter='@seedcord/mock-http^...' --filter='@seedcord/mock-edge^...' --filter='@seedcord/eslint-config...' --filter='@seedcord/eslint-plugin...'
      - run: vp run check:typescript-floor

  node-floor:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Node floor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24.11'
      - run: vp exec turbo test --concurrency=2 --continue --filter='!@seedcord/scripts'

  bun:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Bun ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: floor
            version: '1.4.2'
          - label: latest
            version: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-cache
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ vars.TURBO_TEAM }}
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.version }}
      - run: vp exec turbo build --filter='@seedcord/mock-http^...'
      - run: bun --bun bin/seedcord.mjs --version
        working-directory: cli/seedcord
      - run: |
          bun run codegen --check
          bun run build
        working-directory: mocks/http
      - run: vp exec turbo build --filter='seedcord^...'
      - run: pnpm exec vitest run tests/commands/build
        working-directory: cli/seedcord

  audit:
    if: github.event_name == 'push'
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level=high
