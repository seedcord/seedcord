name: checks

on:
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - 'assets/**'
    push:
        branches:
            - main
            - next
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - 'assets/**'
    merge_group:
        types: [checks_requested]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        name: Verify workspace
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Turbo cache
              uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'

            - name: Setup workspace
              uses: ./.github/actions/setup

            - name: Check workspace catalog
              run: pnpm check:catalog

            - name: Lint
              run: pnpm lint

            - name: Check formatting
              run: pnpm fmt:check

            - name: Type check
              run: pnpm tc

            - name: Test
              run: pnpm turbo test --concurrency=2

            - name: Build
              run: pnpm build
              env:
                  SEEDCORD_DOCS_INDEX_URL: https://cdn.seedcord.org/index.json

            - name: Generate docs manifest
              run: pnpm turbo docs:extract

            - name: Audit for high severity vulnerabilities
              if: github.event_name == 'push'
              run: pnpm audit --prod --audit-level=high
