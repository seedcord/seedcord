name: site-preview-cleanup

on:
  # zizmor: ignore[dangerous-triggers] this never checks out or runs the pull request's code
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  delete:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [home, guide]
    steps:
      - name: Delete the preview worker
        env:
          APP: ${{ matrix.app }}
          PR: ${{ github.event.pull_request.number }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/seedcord-$APP-pr$PR?force=true")
          echo "seedcord-$APP-pr$PR: $status"
          [ "$status" = 200 ] || [ "$status" = 404 ]
