name: github-release

on:
    workflow_call:
        inputs:
            published:
                required: true
                type: string
    workflow_dispatch:
        inputs:
            published:
                description: 'JSON array of { "name", "version" } objects that published'
                required: true
                type: string
            sha:
                description: 'Commit to tag and to read the changelogs from'
                required: true
                type: string

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
                  fetch-depth: 0
            - name: Setup workspace
              uses: ./.github/actions/setup

            - name: Build the release notes
              id: notes
              run: |
                  pnpm release:notes --published "$PUBLISHED" --out release-body.md > names.txt
                  cat names.txt
                  for key in tag title tagged prerelease; do
                    echo "$key=$(sed -n "s/^$key: //p" names.txt)" >> "$GITHUB_OUTPUT"
                  done
              env:
                  PUBLISHED: ${{ inputs.published }}

            - name: Push the tag
              if: ${{ steps.notes.outputs.prerelease != 'true' && steps.notes.outputs.tagged != 'true' }}
              run: |
                  git tag "$TAG"
                  git push origin "$TAG"
              env:
                  TAG: ${{ steps.notes.outputs.tag }}

            - name: Create the release
              if: ${{ steps.notes.outputs.prerelease != 'true' }}
              run: |
                  if gh release view "$TAG" > /dev/null 2>&1; then exit 0; fi
                  gh release create "$TAG" --title "$TITLE" --notes-file release-body.md
              env:
                  TAG: ${{ steps.notes.outputs.tag }}
                  TITLE: ${{ steps.notes.outputs.title }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
