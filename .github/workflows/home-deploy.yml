name: home-deploy

on:
  push:
    branches: [main, next]
    paths:
      - 'apps/home/**'
      - 'tooling/ui/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/home-deploy.yml'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: $/.github/workflows/site-deploy.yml
    with:
      app: home
      preview: ${{ github.ref_name != 'main' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
