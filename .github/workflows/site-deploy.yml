name: site-deploy

on:
  workflow_call:
    inputs:
      app:
        description: The app folder under apps/ to deploy
        required: true
        type: string
      preview:
        description: Deploy to the preview environment at preview.seedcord.org
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      TURBO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Turbo cache
        uses: $/.github/actions/turbo-cache
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ vars.TURBO_TEAM }}

      - name: Setup workspace
        uses: $/.github/actions/setup

      - name: Build
        run: pnpm turbo build --filter="@seedcord/$APP..."
        env:
          APP: ${{ inputs.app }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ inputs.preview && 'https://preview.seedcord.org' || 'https://seedcord.org' }}

      - name: Restore guide embeddings
        if: inputs.app == 'guide'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/guide-embeddings
          key: guide-embeddings-
          restore-keys: guide-embeddings-

      - name: Embed guide sections
        if: inputs.app == 'guide'
        run: pnpm guide:embed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Save guide embeddings
        if: inputs.app == 'guide'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/guide-embeddings
          key: guide-embeddings-${{ hashFiles('.cache/guide-embeddings/*') }}

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ inputs.app }}
          packageManager: pnpm
          command: ${{ inputs.preview && 'deploy --env preview' || 'deploy' }}
