name: site-deploy

on:
  workflow_call:
    inputs:
      app:
        description: The app folder under apps/ to deploy
        required: true
        type: string
      site_url:
        description: The public URL the build renders links against
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ vars.TURBO_TEAM }}
          enable_fallback_cache: 'true'

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm turbo build --filter="@seedcord/$APP..."
        env:
          APP: ${{ inputs.app }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ inputs.app }}
          packageManager: pnpm
          command: deploy
