name: commitlint

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches-ignore:
      - 'dependabot/**'

permissions:
  contents: read

jobs:
  commitlint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    concurrency:
      group: commitlint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: $/.github/actions/setup
        with:
          install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --filter .

      - name: Lint last commit
        if: github.event_name == 'push'
        run: vp exec commitlint --last --verbose

      - name: Lint PR commit range
        if: github.event_name == 'pull_request'
        run: vp exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
