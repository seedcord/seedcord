name: Type labeler

on:
    pull_request_target:
        types:
            - opened
            - edited

permissions:
    contents: read
    pull-requests: write

jobs:
    label-by-title:
        name: Auto-label by PR title
        runs-on: ubuntu-latest
        steps:
            - name: Apply conventional commit labels
              uses: bcoe/conventional-release-labels@v1
              with:
                  type_labels: |
                      {
                        "feat": "type:feature",
                        "fix": "type:bug",
                        "docs": "type:docs",
                        "chore": "type:chore",
                        "refactor": "type:refactor"
                      }
                  ignored_types: '["ci", "test", "style", "perf", "build", "revert"]'
