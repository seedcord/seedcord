name: Bug report
description: Something in seedcord behaves in a way you did not expect
type: Bug
labels:
  - '🔍 triage'

body:
  - type: markdown
    attributes:
      value: |
        Only the first field is required. Fill in whatever else you have.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what you expected instead.
      placeholder: |
        I added a second option to my command and this.options.getString('reason') still returns string | null.
        I expected it to be a string, since I declared it required.
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: seedcord versions
      description: Every `seedcord` and `@seedcord/*` line from your package.json, or the output of `pnpm list "@seedcord/*" seedcord`.
      render: text

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - gateway
        - http
        - http (edge)
        - not sure

  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: Node on Windows, Cloudflare Workers

  - type: textarea
    id: details
    attributes:
      label: Code, errors, or logs
      description: Paste the text. A screenshot of an error can't be searched or copied.
      render: text
